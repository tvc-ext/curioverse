name: Android Release

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - agent/play-families-hardening
  workflow_dispatch:
    inputs:
      release_version:
        description: "Semantic version name, for example 1.0.0"
        required: true
        default: "1.0.0"
      version_code:
        description: "Integer Android version code. Must increase for Play Store uploads."
        required: true

permissions:
  contents: write

concurrency:
  group: curioverse-android-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_VERSION: ${{ github.event.inputs.release_version || vars.CURIOVERSE_RELEASE_VERSION || '1.0.0' }}
  RELEASE_BUILD_NUMBER: ${{ github.event.inputs.version_code || github.run_number }}

jobs:
  build:
    name: Validate and audit Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --org com.tvcext --project-name curioverse --platforms=android .
      - name: Configure Android capabilities
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          source = path.read_text()
          additions = '''    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
          '''
          marker = ">\n    <application"
          if "android.permission.INTERNET" not in source:
              source = source.replace(marker, ">\n" + additions + "    <application", 1)
          path.write_text(source)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Audit merged release manifest
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android app:processReleaseMainManifest
          manifest=$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml | head -n 1)
          test -n "$manifest"
          cp "$manifest" curioverse-merged-release-manifest.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("curioverse-merged-release-manifest.xml").getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          permissions = sorted({n.attrib.get(ns + "name", "") for n in root if n.tag in {"uses-permission", "uses-permission-sdk-23"}} - {""})
          expected = {"android.permission.INTERNET", "android.permission.CAMERA"}
          blocked = {
              "android.permission.ACCESS_FINE_LOCATION", "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.READ_CONTACTS", "android.permission.WRITE_CONTACTS",
              "android.permission.RECORD_AUDIO", "android.permission.READ_PHONE_STATE",
              "android.permission.CALL_PHONE", "android.permission.READ_SMS", "android.permission.SEND_SMS"
          }
          print("Merged release permissions:")
          for p in permissions:
              print("-", p)
          missing = expected - set(permissions)
          unexpected = blocked.intersection(permissions)
          if missing:
              raise SystemExit("Missing expected permissions: " + ", ".join(sorted(missing)))
          if unexpected:
              raise SystemExit("Unexpected sensitive permissions: " + ", ".join(sorted(unexpected)))
          PY
      - name: Upload merged manifest audit
        uses: actions/upload-artifact@v4
        with:
          name: curioverse-merged-release-manifest
          path: curioverse-merged-release-manifest.xml
          retention-days: 30
      - name: Write summary
        if: always()
        run: |
          echo "## CurioVerse Android Families audit" >> "$GITHUB_STEP_SUMMARY"
          echo "- flutter analyze and flutter test executed" >> "$GITHUB_STEP_SUMMARY"
          echo "- merged release manifest inspected" >> "$GITHUB_STEP_SUMMARY"
          echo "- INTERNET and CAMERA expected" >> "$GITHUB_STEP_SUMMARY"
          echo "- location, contacts, microphone, phone and SMS permissions blocked" >> "$GITHUB_STEP_SUMMARY"
