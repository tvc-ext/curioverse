name: Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: curioverse-android-release
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --release

      - name: Smoke test APK on Android emulator
        if: github.event_name != 'pull_request'
        run: |
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          avdmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          adb_path="$ANDROID_HOME/platform-tools/adb"
          test -x "$sdkmanager_path"
          test -x "$avdmanager_path"
          test -x "$adb_path"
          yes | "$sdkmanager_path" "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64" >/dev/null
          echo no | "$avdmanager_path" create avd --force --name curioverse-smoke --package "system-images;android-35;google_apis;x86_64"
          "$ANDROID_HOME/emulator/emulator"             -avd curioverse-smoke             -no-window             -no-audio             -no-boot-anim             -gpu swiftshader_indirect             >/tmp/curioverse-emulator.log 2>&1 &
          "$adb_path" wait-for-device
          timeout 300 bash -c 'until [ "$("$adb_path" shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'
          "$adb_path" install -r build/app/outputs/flutter-apk/app-release.apk
          package_name="$("$adb_path" shell pm list packages | sed -n 's/package:\(.*curioverse.*\)/\1/p' | tr -d "\r" | head -n 1)"
          test -n "$package_name"
          "$adb_path" logcat -c
          "$adb_path" shell monkey -p "$package_name" -c android.intent.category.LAUNCHER 1
          sleep 8
          "$adb_path" shell pidof "$package_name"
          if "$adb_path" logcat -d | grep -q "FATAL EXCEPTION"; then
            "$adb_path" logcat -d
            exit 1
          fi

      - name: Prepare stable APK filename
        if: github.event_name != 'pull_request'
        run: cp build/app/outputs/flutter-apk/app-release.apk curioverse-latest.apk

      - name: Replace the single GitHub Release
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        env:
          APK_PATH: curioverse-latest.apk
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'latest';

            // Build and tests have already succeeded. Only now remove the old release.
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: existing.data.id,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });
            } catch (error) {
              // GitHub may return 404 or 422 when the tag does not yet exist.
              if (![404, 422].includes(error.status)) throw error;
            }

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha,
            });

            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: 'CurioVerse Latest APK',
              body: [
                'Latest successful CurioVerse Android build.',
                '',
                `Commit: ${context.sha}`,
                'The previous release and APK are replaced automatically.',
              ].join('\n'),
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });

            const apkPath = process.env.APK_PATH;
            const data = fs.readFileSync(apkPath);
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.data.id,
              name: 'curioverse-latest.apk',
              headers: {
                'content-type': 'application/vnd.android.package-archive',
                'content-length': data.length,
              },
              data,
            });

      - name: Write summary
        if: always()
        run: |
          echo "## CurioVerse Android" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validation: flutter analyze + flutter test + Android emulator launch" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: curioverse-latest.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "- Retention: one replaceable GitHub Release tagged latest" >> "$GITHUB_STEP_SUMMARY"
