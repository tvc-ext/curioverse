name: Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: curioverse-android-release
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --org com.tvcext --project-name curioverse --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Configure permanent Android signing
        if: github.event_name != 'pull_request'
        env:
          CURIOVERSE_KEYSTORE_BASE64: ${{ secrets.CURIOVERSE_KEYSTORE_BASE64 }}
          CURIOVERSE_KEY_ALIAS: ${{ secrets.CURIOVERSE_KEY_ALIAS }}
          CURIOVERSE_KEY_PASSWORD: ${{ secrets.CURIOVERSE_KEY_PASSWORD }}
          CURIOVERSE_STORE_PASSWORD: ${{ secrets.CURIOVERSE_STORE_PASSWORD }}
        run: |
          test -n "$CURIOVERSE_KEYSTORE_BASE64"
          test -n "$CURIOVERSE_KEY_ALIAS"
          test -n "$CURIOVERSE_KEY_PASSWORD"
          test -n "$CURIOVERSE_STORE_PASSWORD"
          printf '%s' "$CURIOVERSE_KEYSTORE_BASE64" | base64 --decode > android/app/curioverse-release.jks
          {
            echo "storeFile=curioverse-release.jks"
            echo "storePassword=$CURIOVERSE_STORE_PASSWORD"
            echo "keyAlias=$CURIOVERSE_KEY_ALIAS"
            echo "keyPassword=$CURIOVERSE_KEY_PASSWORD"
          } > android/key.properties
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          source = path.read_text()
          signing = """    signingConfigs {
                  create("release") {
                      val properties = java.util.Properties()
                      properties.load(rootProject.file("key.properties").inputStream())
                      keyAlias = properties.getProperty("keyAlias")
                      keyPassword = properties.getProperty("keyPassword")
                      storeFile = file(properties.getProperty("storeFile"))
                      storePassword = properties.getProperty("storePassword")
                  }
              }
          """
          source = source.replace("    buildTypes {", signing + "    buildTypes {")
          source = source.replace(
              "signingConfig = signingConfigs.getByName(\"debug\")",
              "signingConfig = signingConfigs.getByName(\"release\")",
          )
          path.write_text(source)
          PY

      - name: Build release APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --release --build-name 1.0.0 --build-number ${{ github.run_number }}

      - name: Enable KVM for Android emulator
        if: github.event_name != 'pull_request'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test APK on Android emulator
        if: github.event_name != 'pull_request'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install build/app/outputs/flutter-apk/app-release.apk
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            package_name="$(adb shell pm list packages | sed -n 's/package:\(.*curioverse.*\)/\1/p' | tr -d '\r' | head -n 1)"
            test -n "$package_name"
            adb logcat -c
            adb shell monkey -p "$package_name" -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof "$package_name"
            if adb logcat -d | grep -q "FATAL EXCEPTION"; then
              adb logcat -d
              exit 1
            fi

      - name: Prepare stable APK filename
        if: github.event_name != 'pull_request'
        run: cp build/app/outputs/flutter-apk/app-release.apk curioverse-latest.apk

      - name: Replace the single GitHub Release
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        env:
          APK_PATH: curioverse-latest.apk
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'latest';

            // Build and tests have already succeeded. Only now remove the old release.
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: existing.data.id,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });
            } catch (error) {
              // GitHub may return 404 or 422 when the tag does not yet exist.
              if (![404, 422].includes(error.status)) throw error;
            }

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha,
            });

            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: 'CurioVerse Latest APK',
              body: [
                'Latest successful CurioVerse Android build.',
                '',
                `Commit: ${context.sha}`,
                'The previous release and APK are replaced automatically.',
              ].join('\n'),
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });

            const apkPath = process.env.APK_PATH;
            const data = fs.readFileSync(apkPath);
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.data.id,
              name: 'curioverse-latest.apk',
              headers: {
                'content-type': 'application/vnd.android.package-archive',
                'content-length': data.length,
              },
              data,
            });

      - name: Write summary
        if: always()
        run: |
          echo "## CurioVerse Android" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validation: flutter analyze + flutter test + Android emulator launch" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: curioverse-latest.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "- Updates: stable com.tvcext.curioverse ID, permanent signing, increasing build number" >> "$GITHUB_STEP_SUMMARY"
          echo "- Retention: one replaceable GitHub Release tagged latest" >> "$GITHUB_STEP_SUMMARY"
