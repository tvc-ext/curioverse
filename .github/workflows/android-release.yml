name: Android Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Semantic version name, for example 1.0.0"
        required: true
        default: "1.0.0"
      version_code:
        description: "Integer Android version code. Must increase for Play Store uploads."
        required: true

permissions:
  contents: write

concurrency:
  group: curioverse-android-release
  cancel-in-progress: true

env:
  RELEASE_VERSION: ${{ github.event.inputs.release_version || vars.CURIOVERSE_RELEASE_VERSION || '1.0.0' }}
  RELEASE_BUILD_NUMBER: ${{ github.event.inputs.version_code || github.run_number }}

jobs:
  build:
    name: Validate and package Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --org com.tvcext --project-name curioverse --platforms=android .

      - name: Configure Android capabilities
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          source = path.read_text()
          permissions = """    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
          """
          marker = ">\n    <application"
          if "android.permission.INTERNET" not in source:
              source = source.replace(marker, ">\n" + permissions + "    <application", 1)
          path.write_text(source)
          PY
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.CAMERA" android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Decode Play upload keystore
        id: signing
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.CURIOVERSE_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.CURIOVERSE_UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.CURIOVERSE_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.CURIOVERSE_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ] || [ -z "$UPLOAD_KEYSTORE_PASSWORD" ] || [ -z "$UPLOAD_KEY_ALIAS" ] || [ -z "$UPLOAD_KEY_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Play Store signing secrets are not fully configured; signed release packaging will be skipped."
            exit 0
          fi

          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$UPLOAD_KEYSTORE_PASSWORD
          keyPassword=$UPLOAD_KEY_PASSWORD
          keyAlias=$UPLOAD_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Configure Gradle release signing
        if: steps.signing.outputs.configured == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if groovy.exists():
              path = groovy
              source = path.read_text()
              source = source.replace(
                  "plugins {",
                  """def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          plugins {""",
                  1,
              )
              source = source.replace(
                  "android {",
                  """android {
              signingConfigs {
                  release {
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                      storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                      storePassword keystoreProperties["storePassword"]
                  }
              }""",
                  1,
              )
              source = source.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
              source = source.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              path.write_text(source)
          elif kotlin.exists():
              path = kotlin
              source = path.read_text()
              source = source.replace(
                  "plugins {",
                  """import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          plugins {""",
                  1,
              )
              source = source.replace(
                  "android {",
                  """android {
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }""",
                  1,
              )
              source = source.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              path.write_text(source)
          else:
              raise SystemExit("No generated Android app Gradle file found")
          PY

      - name: Build tester APK
        if: github.event_name != 'pull_request' || github.head_ref == 'agent/play-store-readiness'
        run: flutter build apk --release --target-platform android-arm64 --split-debug-info=build/debug-info --build-name "$RELEASE_VERSION" --build-number "$RELEASE_BUILD_NUMBER"

      - name: Build Play Store app bundle
        if: steps.signing.outputs.configured == 'true' && (github.event_name != 'pull_request' || github.head_ref == 'agent/play-store-readiness')
        run: flutter build appbundle --release --target-platform android-arm64 --split-debug-info=build/debug-info --build-name "$RELEASE_VERSION" --build-number "$RELEASE_BUILD_NUMBER"

      - name: Prepare release artifacts
        if: github.event_name != 'pull_request' || github.head_ref == 'agent/play-store-readiness'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk curioverse-latest.apk
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab curioverse-play-store.aab
          fi

      - name: Upload tester APK artifact
        if: github.event_name != 'pull_request' || github.head_ref == 'agent/play-store-readiness'
        uses: actions/upload-artifact@v4
        with:
          name: curioverse-tester-apk
          path: curioverse-latest.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Play Store AAB artifact
        if: steps.signing.outputs.configured == 'true' && (github.event_name != 'pull_request' || github.head_ref == 'agent/play-store-readiness')
        uses: actions/upload-artifact@v4
        with:
          name: curioverse-play-store-aab
          path: curioverse-play-store.aab
          if-no-files-found: error
          retention-days: 14

      - name: Replace the single GitHub Release
        if: github.event_name != 'pull_request' || github.head_ref == 'agent/play-store-readiness'
        uses: actions/github-script@v7
        env:
          APK_PATH: curioverse-latest.apk
          AAB_PATH: curioverse-play-store.aab
          SIGNED_AAB_AVAILABLE: ${{ steps.signing.outputs.configured }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          RELEASE_BUILD_NUMBER: ${{ env.RELEASE_BUILD_NUMBER }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'latest';

            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: existing.data.id,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });
            } catch (error) {
              if (![404, 422].includes(error.status)) throw error;
            }

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha,
            });

            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: 'CurioVerse Latest Android Release',
              body: [
                'Latest successful CurioVerse Android build.',
                '',
                `Version: ${process.env.RELEASE_VERSION}+${process.env.RELEASE_BUILD_NUMBER}`,
                `Commit: ${context.sha}`,
                'The previous release and Android artifacts are replaced automatically.',
              ].join('\n'),
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });

            const upload = async (filePath, name, contentType) => {
              const data = fs.readFileSync(filePath);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.data.id,
                name,
                headers: {
                  'content-type': contentType,
                  'content-length': data.length,
                },
                data,
              });
            };

            await upload(process.env.APK_PATH, 'curioverse-latest.apk', 'application/vnd.android.package-archive');

            if (process.env.SIGNED_AAB_AVAILABLE === 'true' && fs.existsSync(process.env.AAB_PATH)) {
              await upload(process.env.AAB_PATH, 'curioverse-play-store.aab', 'application/octet-stream');
            }

      - name: Write summary
        if: always()
        run: |
          echo "## CurioVerse Android" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validation: flutter analyze + flutter test" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: $RELEASE_VERSION+$RELEASE_BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: optimized ARM64 tester install artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- Play Store AAB: generated only when upload-key signing secrets are configured" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signing: GitHub Secrets only; no keystore or passwords committed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Retention: one replaceable GitHub Release tagged latest" >> "$GITHUB_STEP_SUMMARY"
